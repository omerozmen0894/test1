workflows:
  ios-appstore:
    name: Wrap Maze iOS - App Store Connect
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      flutter: stable
      xcode: 26.0
      cocoapods: default
      groups:
        - code-signing
      vars:
        BUNDLE_ID: com.wrapmaze.game
        APP_NAME: Wrap Maze
    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/Library/Caches/CocoaPods
    scripts:
      - name: Show versions
        script: |
          flutter config --no-enable-swift-package-manager
          flutter --version
          xcodebuild -version
      - name: Prepare iOS dependency set
        script: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("pubspec.yaml")
          removed = {"isar_flutter_libs", "games_services", "in_app_purchase", "in_app_purchase_android"}
          lines = []
          for line in path.read_text().splitlines():
              stripped = line.strip()
              if any(stripped.startswith(f"{name}:") for name in removed):
                  continue
              lines.append(line)
          path.write_text("\n".join(lines) + "\n")
          PY
      - name: Get Flutter packages
        script: |
          flutter clean
          rm -f .flutter-plugins .flutter-plugins-dependencies
          flutter pub get
      - name: Patch Firebase iOS modular imports
        script: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          roots = [
              Path.home() / ".pub-cache" / "hosted" / "pub.dev",
              Path("ios/.symlinks/plugins"),
          ]
          old = "#import <Firebase/Firebase.h>"
          package_imports = {
              "firebase_database": "#import <FirebaseCore/FirebaseCore.h>\n#import <FirebaseDatabase/FirebaseDatabase.h>",
              "firebase_auth": "#import <FirebaseCore/FirebaseCore.h>\n#import <FirebaseAuth/FirebaseAuth.h>",
              "cloud_firestore": "#import <FirebaseCore/FirebaseCore.h>\n#import <FirebaseFirestore/FirebaseFirestore.h>",
          }
          patched = False

          for root in roots:
              if not root.exists():
                  continue
              for package_name, new in package_imports.items():
                  packages = list(root.glob(f"{package_name}*"))
                  for package in packages:
                      classes = package / "ios" / "Classes"
                      if not classes.exists():
                          continue
                      for path in list(classes.rglob("*.h")) + list(classes.rglob("*.m")):
                          text = path.read_text()
                          if old not in text:
                              continue
                          path.chmod(path.stat().st_mode | 0o200)
                          path.write_text(text.replace(old, new))
                          print(f"Patched {package_name} modular import in {path}")
                          patched = True

          if not patched:
              raise SystemExit("Firebase iOS modular import patch target was not found.")
          PY
      - name: Remove risky native plugins from iOS plugin list
        script: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path(".flutter-plugins-dependencies")
          data = json.loads(path.read_text())
          removed = {"isar_flutter_libs", "games_services", "in_app_purchase", "in_app_purchase_android"}
          for platform in ("ios", "macos"):
              plugins = data.get("plugins", {}).get(platform, [])
              data["plugins"][platform] = [
                  plugin for plugin in plugins
                  if plugin.get("name") not in removed
              ]
          path.write_text(json.dumps(data, separators=(",", ":")))
          PY
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path(".flutter-plugins-dependencies").read_text())
          ios_plugins = {p.get("name") for p in data.get("plugins", {}).get("ios", [])}
          blocked = ios_plugins & {"isar_flutter_libs", "games_services", "in_app_purchase", "in_app_purchase_android", "in_app_purchase_storekit"}
          if blocked:
              raise SystemExit(f"Blocked iOS plugins still present: {sorted(blocked)}")
          PY
      - name: Install iOS pods
        script: |
          cd ios
          pod deintegrate || true
          rm -rf Pods Podfile.lock .symlinks
          cd ..
          cd ios
          pod install --repo-update
      - name: Patch gRPC for Xcode
        script: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          candidates = [
              path for path in Path("ios/Pods").glob("**/src/core/lib/promise/detail/basic_seq.h")
              if "gRPC" in str(path)
          ]
          if not candidates:
              raise SystemExit("gRPC basic_seq.h was not found after pod install.")

          old = "Traits::template CallSeqFactory(f_, *cur_, std::move(arg))"
          new = "Traits::template CallSeqFactory<>(f_, *cur_, std::move(arg))"

          patched = False
          for path in candidates:
              text = path.read_text()
              if old in text:
                  path.chmod(path.stat().st_mode | 0o200)
                  path.write_text(text.replace(old, new))
                  print(f"Patched {path}")
                  patched = True
              elif new in text:
                  print(f"Already patched {path}")
                  patched = True

          if not patched:
              raise SystemExit("gRPC patch target line was not found.")
          PY
      - name: Disable risky native registration on iOS
        script: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("ios/Runner/GeneratedPluginRegistrant.m")
          cleaned = []
          skip_until_endif = False
          blocked_imports = (
              "#if __has_include(<isar_flutter_libs/",
              "#if __has_include(<games_services/",
              "#if __has_include(<in_app_purchase_storekit/",
          )
          blocked_registrations = (
              "IsarFlutterLibsPlugin registerWithRegistrar",
              "SwiftGamesServicesPlugin registerWithRegistrar",
              "InAppPurchasePlugin registerWithRegistrar",
          )
          for line in path.read_text().splitlines():
              if any(token in line for token in blocked_imports):
                  skip_until_endif = True
                  continue
              if skip_until_endif:
                  if line.strip() == "#endif":
                      skip_until_endif = False
                  continue
              if any(token in line for token in blocked_registrations):
                  continue
              cleaned.append(line)
          path.write_text("\n".join(cleaned) + "\n")
          PY
          grep -Eq "IsarFlutterLibsPlugin|SwiftGamesServicesPlugin|InAppPurchasePlugin|isar_flutter_libs|games_services|in_app_purchase" ios/Runner/GeneratedPluginRegistrant.m && exit 1 || true
      - name: Set up keychain
        script: |
          keychain initialize
      - name: Fetch iOS signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Add signing certificates to keychain
        script: |
          keychain add-certificates
      - name: Configure iOS signing settings
        script: |
          set -euo pipefail

          PROFILE_PATH=$(
            find \
              "$HOME/Library/MobileDevice/Provisioning Profiles" \
              "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" \
              -name "*.mobileprovision" -print 2>/dev/null | head -n 1
          )

          if [ -z "${PROFILE_PATH:-}" ]; then
            echo "No iOS provisioning profile was found after fetch-signing-files."
            echo "Available profiles:"
            find "$HOME/Library" -name "*.mobileprovision" -print 2>/dev/null || true
            exit 1
          fi

          echo "Using provisioning profile file: $PROFILE_PATH"
          PROFILE_PLIST="$CM_BUILD_DIR/profile.plist"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" "$PROFILE_PLIST")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print TeamIdentifier:0" "$PROFILE_PLIST")

          {
            echo ""
            echo "IPHONEOS_DEPLOYMENT_TARGET=15.0"
            echo "DEVELOPMENT_TEAM=$TEAM_ID"
            echo "CODE_SIGN_STYLE=Manual"
            echo "CODE_SIGN_IDENTITY=Apple Distribution"
            echo "CODE_SIGN_IDENTITY[sdk=iphoneos*]=Apple Distribution"
            echo "PROVISIONING_PROFILE_SPECIFIER=$PROFILE_NAME"
            echo "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]=$PROFILE_NAME"
          } >> ios/Flutter/Release.xcconfig
          echo "Using provisioning profile: $PROFILE_NAME"
          echo "Using Apple team: $TEAM_ID"
      - name: Build signed IPA
        script: |
          flutter build ipa --release \
            --no-pub \
            --build-name=1.0.23 \
            --build-number=60 \
            --export-method=app-store
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false

