name: wrap_maze
description: Wrap Maze - Tam ozellikli labirent bulmaca oyunu
publish_to: 'none'
version: 1.2.1+66

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Local database
  isar_community: 3.2.1
  isar_community_flutter_libs: 3.2.1
  path_provider: ^2.1.3

  # Animasyon
  flutter_animate: ^4.5.0
  audioplayers: ^6.1.0

  # Firebase
  firebase_core: ^2.32.0
  firebase_auth: ^4.20.0
  cloud_firestore: ^4.17.5
  firebase_database: ^10.5.7      # Multiplayer realtime

  # Google Play Games
  games_services: ^4.1.1

  # Genel
  shared_preferences: ^2.2.3
  intl: ">=0.19.0 <0.21.0"
  uuid: ^4.4.2
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  isar_community_generator: 3.2.1

flutter:
  uses-material-design: true
  assets:
    - assets/audio/

